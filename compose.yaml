services:
  db:
    container_name: database
    image: mysql
    restart: always
    ports:
      - 3307:${MYSQL_PORT:-3306}
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - ./mysql_data:/var/lib/mysql

  backend:
    container_name: backend
    build: backend
    ports:
      - 8080:${SPRING_PORT:-8080}
    environment:
      SPRING_MYSQL_DATABASE: ${MYSQL_DATABASE}
      SPRING_MYSQL_PORT: ${MYSQL_PORT}
      SPRING_MYSQL_HOST: ${MYSQL_HOST}
      SPRING_MYSQL_USERNAME: ${MYSQL_ROOT_USERNAME}
      SPRING_MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
    volumes:
      - ./backend:/usr/local/app
      - ~/.m2:/root/.m2

  frontend:
      container_name: frontend
      build: frontend
      ports:
        - 5173:${REACT_PORT:-5173}
      volumes:
        - ./frontend:/app
        - /app/node_modules