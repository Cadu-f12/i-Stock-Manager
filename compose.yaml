services:
  db:
    container_name: database
    image: mysql
    restart: always
    ports:
      - "${MYSQL_PUBLISHED_PORT:-3307}:3306"
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-istock}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123}
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysql -h 127.0.0.1 -u root -D $$MYSQL_DATABASE -e 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    volumes:
      - ./mysql_data:/var/lib/mysql

  backend:
    container_name: backend
    build: backend
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${SPRING_PORT:-8080}:8080"
    environment:
      SERVER_PORT: "8080"
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/${MYSQL_DATABASE:-istock}
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123}
    volumes:
      - ./backend:/usr/local/app
      - ~/.m2:/root/.m2

  frontend:
    container_name: frontend
    build: frontend
    depends_on:
      - backend
    ports:
      - "${REACT_PORT:-5173}:5173"
    environment:
      API_TARGET: http://backend:8080
    volumes:
      - ./frontend:/app
      - /app/node_modules
