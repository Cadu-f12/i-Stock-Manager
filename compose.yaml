services:
  db:
    container_name: database
    image: mysql
    restart: always
    ports:
      - 3307:3306
    environment:
      MYSQL_DATABASE: istock
      MYSQL_ROOT_PASSWORD: 123
    volumes:
      - ./mysql_data:/var/lib/mysql

  backend:
    container_name: backend
    build: backend
    ports:
      - 8080:8080
    volumes:
      - ./backend:/usr/local/app
      - ~/.m2:/root/.m2

  frontend:
      container_name: frontend
      build: frontend
      ports:
        - 5173:5173
      volumes:
        - ./frontend:/app